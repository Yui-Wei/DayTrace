name: Publish Windows release
on:
  push:
    tags: ['v*.*.*']
permissions:
  contents: write
jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and package
        shell: powershell
        run: ./source/package.ps1
      - name: Publish verified update assets
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = $env:GITHUB_REF_NAME.Substring(1)
          $folder = "outputs/DayTrace-v$version"
          gh release create $env:GITHUB_REF_NAME "$folder/DayTrace.exe" "$folder/update.json" "outputs/DayTrace-v$version.zip" --verify-tag --draft --title "拾时 $version" --notes-file RELEASE_NOTES.md
          if ($LASTEXITCODE -ne 0) { throw 'Release upload failed' }
          gh release edit $env:GITHUB_REF_NAME --draft=false --latest
          if ($LASTEXITCODE -ne 0) { throw 'Release publishing failed' }
